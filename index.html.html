<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VELORA CAFFE — نظام التشغيل والصلاحيات</title>
<style>
  :root {
    --bg-main: #0c0b09;
    --bg-card: #161410;
    --bg-card-hover: #1e1b15;
    --bg-elevated: #231f18;
    --gold: #d4af37;
    --gold-light: #f0d378;
    --gold-dim: rgba(212, 175, 55, 0.16);
    --border-gold: rgba(212, 175, 55, 0.35);
    --text-main: #f6f2e7;
    --text-muted: #b7ad96;
    --success: #2ea043;
    --danger: #e5534b;
    --warning: #d29922;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 84px;
    line-height: 1.65;
  }

  .topbar {
    background: linear-gradient(180deg, #1a1610 0%, #110f0b 100%);
    border-bottom: 1px solid var(--border-gold);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .brand-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-badge {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--gold-dim);
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-light);
    font-weight: 800;
    font-size: 16px;
  }

  .brand-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: 0.4px;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .btn {
    background: var(--bg-elevated);
    color: var(--text-main);
    border: 1px solid var(--border-gold);
    border-radius: 9px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--gold);
  }

  .btn-gold {
    background: linear-gradient(135deg, #dfc05e 0%, #c19a28 100%);
    color: #120f08;
    border: none;
    font-weight: 800;
  }

  .btn-gold:hover {
    filter: brightness(1.06);
  }

  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 18px;
  }

  .hero-card {
    background: linear-gradient(135deg, #1b1710 0%, #13110c 100%);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
  }

  .role-pill {
    display: inline-block;
    background: var(--gold-dim);
    color: var(--gold-light);
    border: 1px solid var(--border-gold);
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .section-heading {
    font-size: 16px;
    font-weight: 800;
    color: var(--gold-light);
    margin: 18px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .roles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
  }

  .role-card {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 15px;
    cursor: pointer;
    transition: 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
  }

  .role-card:hover {
    background: var(--bg-card-hover);
    transform: translateY(-2px);
    border-color: var(--gold-light);
  }

  .role-num {
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
  }

  .role-name {
    font-size: 16px;
    font-weight: 800;
    color: var(--text-main);
  }

  .role-desc {
    font-size: 12px;
    color: var(--text-muted);
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .tab-btn {
    background: var(--bg-card);
    color: var(--text-muted);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .tab-btn.active {
    background: var(--gold-dim);
    color: var(--gold-light);
    border-color: var(--gold);
  }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .search-input, .form-input, .form-select {
    width: 100%;
    background: var(--bg-main);
    color: var(--text-main);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .chapter-item {
    border: 1px solid rgba(212, 175, 55, 0.2);
    background: var(--bg-elevated);
    border-radius: 11px;
    padding: 13px;
    margin-bottom: 10px;
  }

  .chapter-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--gold-light);
    margin-bottom: 6px;
  }

  .chapter-body {
    font-size: 13px;
    color: var(--text-main);
  }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
    margin-top: 10px;
  }

  .book-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
  }

  .book-card.locked {
    opacity: 0.65;
    border-style: dashed;
  }

  .status-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    display: inline-block;
  }

  .status-open {
    background: rgba(46, 160, 67, 0.18);
    color: #56d364;
  }

  .status-locked {
    background: rgba(229, 83, 75, 0.18);
    color: #ff7b72;
  }

  .check-group-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--gold-light);
    margin: 12px 0 8px;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid rgba(212, 175, 55, 0.18);
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
    cursor: pointer;
  }

  .check-item input {
    margin-top: 3px;
    accent-color: var(--gold);
    transform: scale(1.15);
  }

  .progress-wrap {
    background: var(--bg-main);
    border: 1px solid var(--border-gold);
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    margin: 10px 0 14px;
  }

  .progress-bar {
    background: linear-gradient(90deg, #c19a28, #f0d378);
    height: 100%;
    width: 0%;
    transition: width 0.25s ease;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #12100c;
    border-top: 1px solid var(--border-gold);
    display: flex;
    justify-content: space-around;
    padding: 9px 6px;
    z-index: 40;
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
  }

  .nav-btn.active {
    color: var(--gold-light);
    background: var(--gold-dim);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 60;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--gold);
    border-radius: 16px;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 18px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-gold);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }

  .result-box {
    background: var(--bg-elevated);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
  }

  .log-entry {
    background: var(--bg-elevated);
    border-right: 3px solid var(--gold);
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 12px;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-box">
    <div class="brand-badge">V</div>

<main class="container" id="appContainer"></main>

</nav>

  <div class="modal-box">

      <button class="btn" onclick="closeModal()">إغلاق</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

let state = {
  currentRole: null,
  activeTab: "guide",
  searchQuery: "",
  checkedItems: {},
  signatures: {},
  reports: []
};

function getRoleById(id) {
  return ROLES_DATA.find(r => r.id === id);
}

function goHome() {
  state.currentRole = null;
  state.activeTab = "guide";
  state.searchQuery = "";
  setActiveNav("navHome");
  render();
}

function selectRole(roleId) {
  state.currentRole = roleId;
  state.activeTab = "guide";
  state.searchQuery = "";
  setActiveNav("navHome");
  render();
}

function setActiveNav(navId) {
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  const el = document.getElementById(navId);
  if (el) el.classList.add("active");
}

function render() {
  const container = document.getElementById("appContainer");
  if (!state.currentRole) {
    renderRolesHub(container);
  } else {
    renderRoleWorkspace(container, getRoleById(state.currentRole));
  }
}

function renderRolesHub(container) {
  let html = `
    <section class="hero-card">
      <span class="role-pill">VELORA CAFFE • نظام الأدوار والصلاحيات</span>
      <h1 style="font-size: 22px; color: var(--gold-light); margin-bottom: 6px;">اختر الدور للدخول إلى مساحة العمل</h1>
      <p style="font-size: 13px; color: var(--text-muted);">
        يظهر لكل دور تشغيلي دليله وقائمة متابعته وميثاقه، بينما يمتلك <strong>المدير</strong> و<strong>الأونر</strong> صلاحية فتح جميع الكتب والأدلة.
      </p>
    </section>

    <div class="section-heading">
      <span>تسلسل الأدوار في VELORA CAFFE</span>
    </div>
    <div class="roles-grid">
  `;

  ROLES_DATA.forEach(role => {
    const permText = role.canOpenAllBooks ? "صلاحية فتح أي كتاب" : "دليل الدور المخصص";
    html += `
      <div class="role-card" onclick="selectRole('${role.id}')">
        <div>
          <div class="role-num">خانة ${role.order} • ${permText}</div>
          <div class="role-name">${role.title}</div>
          <div class="role-desc">${role.subtitle}</div>
        </div>
        <div style="font-size: 12px; color: var(--gold); font-weight: 700;">دخول ←</div>
      </div>
    `;
  });

  html += `</div>`;
  container.innerHTML = html;
}

function renderRoleWorkspace(container, role) {
  const permLabel = role.canOpenAllBooks ? "صلاحية فتح أي كتاب متاحة" : "صلاحية الدليل المخصص للدور";

  let html = `
    <section class="hero-card">
      <span class="role-pill">${permLabel} • ${role.sourceFile}</span>
      <h1 style="font-size: 21px; color: var(--gold-light); margin-bottom: 4px;">${role.title}</h1>
      <p style="font-size: 13px; color: var(--text-muted);">${role.subtitle}</p>
    </section>

    <div class="tabs">
      <button class="tab-btn ${state.activeTab === "guide" ? "active" : ""}" onclick="switchTab('guide')">الدليل التدريبي</button>
      <button class="tab-btn ${state.activeTab === "books" ? "active" : ""}" onclick="switchTab('books')">مكتبة الكتب والصلاحيات</button>
      <button class="tab-btn ${state.activeTab === "checklist" ? "active" : ""}" onclick="switchTab('checklist')">قائمة المتابعة</button>
      <button class="tab-btn ${state.activeTab === "pledge" ? "active" : ""}" onclick="switchTab('pledge')">الميثاق والتعهد</button>
    </div>
  `;

  if (state.activeTab === "guide") {
    html += renderGuideTab(role);
  } else if (state.activeTab === "books") {
    html += renderBooksTab(role);
  } else if (state.activeTab === "checklist") {
    html += renderChecklistTab(role);
  } else if (state.activeTab === "pledge") {
    html += renderPledgeTab(role);
  }

  container.innerHTML = html;
}

function switchTab(tab) {
  state.activeTab = tab;
  render();
}

function renderGuideTab(role) {
  const q = state.searchQuery.trim();
  const filtered = role.chapters.filter(ch =>
    !q || ch.title.includes(q) || ch.body.includes(q)
  );

  let html = `
    <div class="panel">
      <input
        type="text"
        class="search-input"
        placeholder="ابحث داخل فصول دليل ${role.title}..."
        value="${escapeHtml(state.searchQuery)}"
        oninput="updateSearch(this.value)"
      />
  `;

  if (filtered.length === 0) {
    html += `<p style="font-size: 13px; color: var(--text-muted);">لا توجد نتائج مطابقة لكلمة البحث.</p>`;
  } else {
    filtered.forEach(ch => {
      html += `
        <div class="chapter-item">
          <div class="chapter-title">${escapeHtml(ch.title)}</div>
          <div class="chapter-body">${escapeHtml(ch.body)}</div>
        </div>
      `;
    });
  }

  html += `</div>`;
  return html;
}

function updateSearch(val) {
  state.searchQuery = val;
  const container = document.getElementById("appContainer");
  renderRoleWorkspace(container, getRoleById(state.currentRole));
  const input = container.querySelector(".search-input");
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

  let html = `
    <div class="panel">
      <div style="font-size: 14px; font-weight: 800; color: var(--gold-light); margin-bottom: 6px;">
        ${role.canOpenAllBooks ? "مكتبة جميع كتب VELORA CAFFE (صلاحية فتح أي كتاب)" : "صلاحيات الكتب لحساب " + role.title}
      </div>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
        ${role.canOpenAllBooks
          ? "يمكنك فتح ومراجعة أي كتاب من أدلة البراند مباشرة."
          : "هذا الحساب مخصص لفتح كتاب الدور الخاص بك؛ لفتح بقية الكتب يلزم الدخول بحساب المدير أو الأونر."}
      </p>
      <div class="books-grid">
  `;

  ROLES_DATA.forEach(bookRole => {
    const allowed = role.canOpenAllBooks || bookRole.id === role.id;
    html += `
      <div class="book-card ${allowed ? "" : "locked"}">
        <div>
          <span class="status-badge ${allowed ? "status-open" : "status-locked"}">
            ${allowed ? "مفتوح للقراءة" : "مقيد بالصلاحية"}
          </span>
          <div style="font-size: 15px; font-weight: 800; margin-top: 8px; color: var(--text-main);">
            دليل ${escapeHtml(bookRole.title)}
          </div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">
            الملف: ${escapeHtml(bookRole.sourceFile)}
          </div>
        </div>
        ${
          allowed
            ? `<button class="btn btn-gold" onclick="previewBook('${bookRole.id}')">فتح الكتاب</button>`
            : `<button class="btn" disabled>غير متاح لهذا الدور</button>`
        }
      </div>
    `;
  });

  html += `</div></div>`;
  return html;
}

function previewBook(targetRoleId) {
  const target = getRoleById(targetRoleId);
  let bodyHtml = `<p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">المصدر: <strong>${escapeHtml(target.sourceFile)}</strong></p>`;
  target.chapters.forEach(ch => {
    bodyHtml += `
      <div class="chapter-item">
        <div class="chapter-title">${escapeHtml(ch.title)}</div>
        <div class="chapter-body">${escapeHtml(ch.body)}</div>
      </div>
    `;
  });
  showModal(`كتاب ${target.title}`, bodyHtml);
}

function renderChecklistTab(role) {
  let totalCount = 0;
  let checkedCount = 0;

  Object.entries(role.checklist).forEach(([group, items]) => {
    items.forEach((_, idx) => {
      totalCount++;
      const key = `${role.id}__${group}__${idx}`;
      if (state.checkedItems[key]) checkedCount++;
    });
  });

  const pct = totalCount > 0 ? Math.round((checkedCount / totalCount) * 100) : 0;

  let html = `
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700;">
        <span>نسبة إتمام قائمة المتابعة: ${pct}%</span>
        <span>${checkedCount} / ${totalCount}</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" style="width: ${pct}%;"></div>
      </div>
  `;

  Object.entries(role.checklist).forEach(([group, items]) => {
    html += `<div class="check-group-title">${escapeHtml(group)}</div>`;
    items.forEach((item, idx) => {
      const key = `${role.id}__${group}__${idx}`;
      const isChecked = !!state.checkedItems[key];
      html += `
        <label class="check-item">
          <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleCheck('${key}')" />
          <span>${escapeHtml(item)}</span>
        </label>
      `;
    });
  });

  html += `<button class="btn" style="margin-top: 8px;" onclick="resetChecklist('${role.id}')">إعادة ضبط القائمة</button></div>`;
  return html;
}

function toggleCheck(key) {
  state.checkedItems[key] = !state.checkedItems[key];
  render();
}

function resetChecklist(roleId) {
  Object.keys(state.checkedItems).forEach(k => {
    if (k.startsWith(roleId + "__")) delete state.checkedItems[k];
  });
  render();
}

function renderPledgeTab(role) {
  const saved = state.signatures[role.id] || { name: "", date: "" };
  let html = `
    <div class="panel">
      <div class="chapter-title" style="font-size: 16px;">الميثاق والتعهد المهني — ${escapeHtml(role.title)}</div>
      <p style="font-size: 14px; margin: 10px 0 16px; background: var(--bg-elevated); padding: 14px; border-radius: 10px; border: 1px solid var(--border-gold);">
        ${escapeHtml(role.pledge)}
      </p>
      <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">اسم الموظف / المسؤول</label>
      <input type="text" class="form-input" id="pledgeName" value="${escapeHtml(saved.name)}" placeholder="اكتب الاسم الثلاثي" />
      <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">التاريخ</label>
      <input type="date" class="form-input" id="pledgeDate" value="${escapeHtml(saved.date)}" />
      <button class="btn btn-gold" onclick="savePledge('${role.id}')">تأكيد وحفظ التعهد</button>
      ${saved.name ? `<div class="result-box">تم تأكيد الميثاق بواسطة: <strong>${escapeHtml(saved.name)}</strong> ${saved.date ? "(" + escapeHtml(saved.date) + ")" : ""}</div>` : ""}
    </div>
  `;
  return html;
}

function savePledge(roleId) {
  const name = document.getElementById("pledgeName").value.trim();
  const date = document.getElementById("pledgeDate").value;
  if (!name) {
    alert("يرجى إدخال اسم الموظف أولاً.");
    return;
  }
  state.signatures[roleId] = { name, date };
  render();
}

function openToolModal(type) {
  if (type === "cash") {
    showModal("حاسبة جرد الكاش ومعادلة العهدة", `
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
        النقد المتوقع = عهدة البداية + المبيعات النقدية − المرتجعات أو المصروفات النقدية المعتمدة
      </p>
      <label style="font-size: 12px; color: var(--text-muted);">عهدة بداية الشيفت</label>
      <input type="number" class="form-input" id="cashOpen" value="1000" />
      <label style="font-size: 12px; color: var(--text-muted);">المبيعات النقدية (كاش)</label>
      <input type="number" class="form-input" id="cashSales" value="0" />
      <label style="font-size: 12px; color: var(--text-muted);">مرتجعات / مصروفات نقدية معتمدة</label>
      <input type="number" class="form-input" id="cashDeduct" value="0" />
      <label style="font-size: 12px; color: var(--text-muted);">العد الفعلي في الدرج</label>
      <input type="number" class="form-input" id="cashActual" value="0" />
      <button class="btn btn-gold" onclick="calcCash()">احسب المطابقة</button>
      <div id="cashCalcResult"></div>
    `);
  } else if (type === "report") {
    let logsHtml = state.reports.length
      ? state.reports.map(r => `<div class="log-entry"><strong>[${escapeHtml(r.type)}]</strong> ${escapeHtml(r.item)} — الكمية: ${escapeHtml(r.qty)} | السبب: ${escapeHtml(r.reason)}</div>`).join("")
      : `<p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">لا توجد بلاغات مسجلة في الجلسة الحالية.</p>`;

    showModal("بلاغ نقص أو هدر فوري", `
      <label style="font-size: 12px; color: var(--text-muted);">نوع البلاغ</label>
      <select class="form-select" id="repType">
        <option value="بلاغ نقص">بلاغ نقص</option>
        <option value="تسجيل هدر">تسجيل هدر</option>
        <option value="عطل / ملاحظة">عطل / ملاحظة</option>
      </select>
      <label style="font-size: 12px; color: var(--text-muted);">اسم الصنف أو الخامة</label>
      <input type="text" class="form-input" id="repItem" placeholder="مثال: أكواب 12 أونصة أو حليب" />
      <label style="font-size: 12px; color: var(--text-muted);">الكمية / الموجود مقابل الحد الأدنى</label>
      <input type="text" class="form-input" id="repQty" placeholder="مثال: الموجود 18 / الحد الأدنى 25" />
      <label style="font-size: 12px; color: var(--text-muted);">السبب أو الإجراء المقترح</label>
      <input type="text" class="form-input" id="repReason" placeholder="مثال: اقتراب نفاد المخزون قبل فترة الذروة" />
      <button class="btn btn-gold" onclick="submitReport()">تسجيل البلاغ</button>
      <div style="margin-top: 14px;">
        <div style="font-size: 13px; font-weight: 700; color: var(--gold-light); margin-bottom: 6px;">البلاغات المسجلة</div>
        <div id="reportsList">${logsHtml}</div>
      </div>
    `);
  }
}

function calcCash() {
  const openAmt = parseFloat(document.getElementById("cashOpen").value) || 0;
  const salesAmt = parseFloat(document.getElementById("cashSales").value) || 0;
  const deductAmt = parseFloat(document.getElementById("cashDeduct").value) || 0;
  const actualAmt = parseFloat(document.getElementById("cashActual").value) || 0;

  const expected = openAmt + salesAmt - deductAmt;
  const diff = actualAmt - expected;
  const statusLabel = diff === 0 ? "متطابق تماماً (الفرق = 0)" : diff > 0 ? `زيادة بمقدار ${diff}` : `عجز بمقدار ${Math.abs(diff)}`;

  document.getElementById("cashCalcResult").innerHTML = `
    <div class="result-box">
      <div>النقد المتوقع في الدرج: <strong>${expected}</strong></div>
      <div>العد الفعلي: <strong>${actualAmt}</strong></div>
      <div>النتيجة: <strong>${statusLabel}</strong></div>
    </div>
  `;
}

function submitReport() {
  const type = document.getElementById("repType").value;
  const item = document.getElementById("repItem").value.trim();
  const qty = document.getElementById("repQty").value.trim();
  const reason = document.getElementById("repReason").value.trim();
  if (!item) {
    alert("يرجى كتابة اسم الصنف أو الخامة.");
    return;
  }
  state.reports.unshift({ type, item, qty: qty || "-", reason: reason || "-" });
  openToolModal("report");
}

function showModal(title, bodyHtml) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  document.getElementById("modalBackdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

render();
</script>
</body>
</html>
